<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'immeuble</title>
<meta name="description" content="Un immeuble planté, dessiné étage par étage à mesure que l'on descend du ciel. Illustration vectorielle pilotée au défilement.">
<meta name="theme-color" content="#e0eff4">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23e0eff4'/><rect x='9' y='7' width='14' height='20' fill='%23333539'/><rect x='7' y='12' width='18' height='3' fill='%23e9bba9'/><rect x='7' y='19' width='18' height='3' fill='%23e9bba9'/><circle cx='12' cy='10' r='3' fill='%23acd162'/><circle cx='20' cy='17' r='3' fill='%23698546'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ================================================================
     Les teintes sont relevees directement sur l'illustration de
     reference, pas approximees a l'oeil.
     ================================================================ */
  :root{
    --ciel-haut:#dcecf2;
    --ciel-bas:#f3f8fa;
    --encre:#2f3a40;
    --encre-douce:#5c6b73;
    --filet:rgba(47,58,64,.16);
    --gouttiere:3vw;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{
    background:var(--ciel-bas);
    color:var(--encre);
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    font-size:clamp(.92rem,.86rem + .25vw,1rem);
    line-height:1.6;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(105,133,70,.22)}

  /* ---- la scene occupe tout l'ecran et reste epinglee ---- */
  #scene{position:sticky;top:0;height:100vh;height:100svh;width:100%;z-index:0}
  #scene svg{display:block;width:100%;height:100%}

  /* la hauteur du defilement est calculee par le script, d'apres la
     hauteur du monde dessine. */
  #defilement{position:relative;z-index:1;pointer-events:none}

  /* ---- chrome, volontairement discret : l'illustration est le sujet ---- */
  /* Le texte du chrome passe sur la facade sombre : sans voile, il
     devient illisible des qu'on quitte le ciel. */
  #entete{
    position:fixed;left:0;right:0;top:0;z-index:3;
    display:flex;align-items:baseline;justify-content:space-between;
    gap:1.5rem;padding:1.3rem var(--gouttiere);
    pointer-events:none;
  }
  #entete::before{
    content:"";position:absolute;left:0;right:0;top:0;bottom:-34px;z-index:-1;
    background:linear-gradient(180deg,rgba(243,248,250,.94) 0%,rgba(243,248,250,.62) 46%,rgba(243,248,250,0) 100%);
  }
  #voile-bas{
    position:fixed;left:0;right:0;bottom:0;height:74px;z-index:2;
    background:linear-gradient(0deg,rgba(243,248,250,.86) 0%,rgba(243,248,250,.42) 48%,rgba(243,248,250,0) 100%);
    pointer-events:none;
  }
  .marque{font-weight:500;font-size:.95rem;letter-spacing:.01em}
  .meta{
    font-size:.64rem;font-weight:500;letter-spacing:.17em;
    text-transform:uppercase;color:var(--encre-douce);text-align:right;
  }

  #indice{
    position:fixed;left:var(--gouttiere);bottom:1.4rem;z-index:3;
    display:flex;flex-direction:column;align-items:flex-start;gap:.7rem;
    font-size:.64rem;font-weight:500;letter-spacing:.2em;
    text-transform:uppercase;color:var(--encre-douce);
    pointer-events:none;
    transition:opacity .5s ease;
  }
  #indice .rail{position:relative;width:1px;height:40px;background:var(--filet);overflow:hidden}
  #indice .rail::after{
    content:"";position:absolute;left:0;top:0;width:1px;height:13px;
    background:#698546;animation:descend 2.2s cubic-bezier(.5,0,.5,1) infinite;
  }
  @keyframes descend{0%{transform:translateY(-110%)}100%{transform:translateY(320%)}}

  /* compteur d'etage, cale en bas a droite */
  #compteur{
    position:fixed;right:var(--gouttiere);bottom:1.4rem;z-index:3;
    font-size:.64rem;font-weight:500;letter-spacing:.18em;
    text-transform:uppercase;color:var(--encre-douce);
    font-variant-numeric:tabular-nums;
    pointer-events:none;
  }
  #compteur b{color:var(--encre);font-weight:500}

  #progression{
    position:fixed;left:0;right:0;bottom:0;z-index:3;height:2px;
    background:rgba(47,58,64,.08);pointer-events:none;
  }
  #progression i{display:block;height:100%;width:100%;background:#698546;
    transform:scaleX(0);transform-origin:0 50%}

  /* ================================================================
     Le dessin etage par etage
     Chaque etage attend d'entrer dans le cadre pour se poser. La
     vegetation suit la structure avec un leger retard : on voit le
     beton, puis les plantes.
     ================================================================ */
  .etage{opacity:0;transform:translate(0,30px);
    transition:opacity .62s ease,transform .62s cubic-bezier(.22,.68,.16,1)}
  .etage.vu{opacity:1;transform:translate(0,0)}
  .etage .verdure{opacity:0;transform:translate(0,14px);
    transition:opacity .7s ease .16s,transform .7s cubic-bezier(.22,.68,.16,1) .16s}
  .etage.vu .verdure{opacity:1;transform:translate(0,0)}

  /* ---- les fenetres : prevues pour recevoir des boutons ---- */
  .fenetre{transition:opacity .25s ease}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    #indice .rail::after{animation:none;height:40px;opacity:.5}
    .etage,.etage .verdure{transition:none}
    .oiseau,.nuage{animation:none !important}
  }

  @media (max-width:700px){
    :root{--gouttiere:5vw}
    .meta{display:none}
  }
</style>
</head>
<body>

<header id="entete">
  <div class="marque">L'immeuble</div>
  <p class="meta">Dessiné étage par étage</p>
</header>

<div id="scene"><svg id="toile" aria-label="Illustration d'un immeuble planté, du ciel jusqu'à la rue" role="img"></svg></div>

<div id="defilement" aria-hidden="true"></div>

<div id="voile-bas" aria-hidden="true"></div>

<div id="indice" aria-hidden="true">
  <span>Descendre</span>
  <span class="rail"></span>
</div>
<p id="compteur" aria-hidden="true">Ciel</p>
<div id="progression" aria-hidden="true"><i></i></div>

<script type="module">
/* ==================================================================
 * 1. LA PALETTE
 *    Relevee sur l'illustration de reference : chaque teinte vient
 *    d'un echantillonnage de l'image, pas d'une approximation.
 * ================================================================== */
const C = {
  cielHaut:   '#dcecf2',
  cielBas:    '#f3f8fa',
  brume:      '#eaf3f6',
  nuage:      '#fbfdfe',
  oiseau:     '#56666f',

  tourLoin:   '#d3dfe6',
  tourMoyen:  '#b5c2d0',
  tourProche: '#8ca4ac',

  dalle:      '#e9bba9',
  dalleHaut:  '#f2cbbb',
  dalleTranche:'#c08a76',
  facade:     '#333539',
  facadeClair:'#3e414a',
  vitre:      '#2b2b35',
  vitreClair: '#3a3a46',
  reflet:     '#5c6472',
  meneau:     '#4f4b5c',
  toit:       '#59515f',
  toitClair:  '#6d6676',
  jardiniere: '#7d5141',
  jardClair:  '#8f5e49',

  vertClair:  '#acd162',
  vertMoyen:  '#698546',
  vertSombre: '#46603a',
  vertNuit:   '#35502f',

  sol:        '#dfe8ec',
  trottoir:   '#cbd8de',
  rue:        '#b9c7cf',
};

/* ==================================================================
 * 2. OUTILS
 * ================================================================== */
const NS = 'http://www.w3.org/2000/svg';

/* aleatoire reproductible : l'immeuble doit etre le meme a chaque
   chargement, sinon ce n'est plus un dessin mais un tirage. */
function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rnd = mulberry32(0x13A7);
const rr = (a, b) => a + (b - a) * rnd();
const ri = (a, b) => Math.floor(rr(a, b + 1));

function el(parent, nom, attrs) {
  const n = document.createElementNS(NS, nom);
  for (const k in attrs) {
    if (attrs[k] !== undefined && attrs[k] !== null) n.setAttribute(k, attrs[k]);
  }
  parent.appendChild(n);
  return n;
}
const g = (parent, attrs) => el(parent, 'g', attrs || {});

/* ==================================================================
 * 3. GABARIT
 *    Le nombre de travees s'adapte au format de l'ecran. Sur un
 *    telephone, un immeuble a quatre travees aurait exactement la
 *    silhouette de l'ecran : on verrait tout d'un coup et il ne
 *    resterait rien a faire defiler.
 * ================================================================== */
const FH = 200;             // hauteur d'un etage
const ETAGES = 7;
const TRAVEE = 150, ENTRE = 18, MARGE = 26;

function gabarit() {
  const ratio = innerWidth / innerHeight;
  const travees = ratio > 1.3 ? 4 : ratio > 0.8 ? 3 : 2;
  const BW = travees * TRAVEE + (travees - 1) * ENTRE + 2 * MARGE;
  const part = ratio > 1.3 ? .64 : ratio > 0.8 ? .76 : .86;
  const VW = Math.round(BW / part);
  return { travees, BW, VW, x0: Math.round((VW - BW) / 2) };
}

/* ==================================================================
 * 4. VEGETATION
 *    Des masses de feuillage en trois verts francs, batis de cercles
 *    qui se chevauchent : c'est ce qui donne la silhouette bombee de
 *    l'illustration de reference, sans aucun degrade.
 * ================================================================== */
function feuillage(parent, cx, cy, larg, haut, densite = 1) {
  const couches = [
    { col: C.vertNuit,   n: Math.round(5 * densite), dy:  .10, r: [.26, .40] },
    { col: C.vertSombre, n: Math.round(7 * densite), dy: -.04, r: [.24, .38] },
    { col: C.vertMoyen,  n: Math.round(7 * densite), dy: -.16, r: [.20, .34] },
    { col: C.vertClair,  n: Math.round(5 * densite), dy: -.28, r: [.15, .26] },
  ];
  for (const c of couches) {
    for (let i = 0; i < c.n; i++) {
      el(parent, 'circle', {
        cx: (cx + rr(-.5, .5) * larg).toFixed(1),
        cy: (cy + c.dy * haut + rr(-.16, .16) * haut).toFixed(1),
        r: (haut * rr(c.r[0], c.r[1])).toFixed(1),
        fill: c.col,
      });
    }
  }
}

/* Les retombees pendent SOUS les massifs, jamais au hasard le long de
   la dalle : isolees sur le vitrage, elles se lisaient comme des traits
   verts flottants au lieu de plantes qui debordent. Chaque brin part
   d'un massif et se termine par une petite feuille. */
function retombees(parent, ancrages, y) {
  for (const a of ancrages) {
    if (rnd() < .55) continue;              /* la plupart des massifs ne retombent pas */
    const n = ri(1, 2);
    for (let i = 0; i < n; i++) {
      const px = a.x + rr(-.40, .40) * a.larg;
      const h = rr(20, 46);
      const dx = rr(-5, 5);
      const col = rnd() < .5 ? C.vertMoyen : C.vertSombre;
      /* une langue effilee plutot qu'un trait termine par une boule :
         la boule donnait une rangee d'epingles sous la dalle. */
      el(parent, 'path', {
        d: `M${(px - 5).toFixed(1)} ${y} `
         + `q ${(dx * 1.4).toFixed(1)} ${(h * .6).toFixed(1)} ${(dx + 2).toFixed(1)} ${h.toFixed(1)} `
         + `q ${(-dx * .4).toFixed(1)} ${(-h * .55).toFixed(1)} ${(-dx + 5).toFixed(1)} ${(-h).toFixed(1)} Z`,
        fill: col,
      });
    }
  }
}

/* ==================================================================
 * 5. UN ETAGE
 *    Dalle debordante, tranche d'ombre, jardinieres posees dessus,
 *    vegetation, puis la facade vitree en dessous.
 * ================================================================== */
const DALLE_H = 24, TRANCHE_H = 9, DEBORD = 24;

/* Deux groupes emboites, et c'est indispensable : la position dans le
   monde est portee par l'ATTRIBUT transform du SVG, l'animation
   d'apparition par la PROPRIETE transform du CSS. Sur un meme element,
   la propriete CSS ecrase l'attribut et l'etage perd sa place. */
/* la facade vitree d'un niveau, posee sous sa dalle */
function facadeVitree(grp, G, i) {
  const { BW, x0 } = G;
  const hautVitrage = DALLE_H + TRANCHE_H;
  const hVit = FH - hautVitrage;
  el(grp, 'rect', { x: x0, y: hautVitrage, width: BW, height: hVit, fill: C.facade });

  /* les trumeaux lateraux, un peu plus clairs que le fond */
  el(grp, 'rect', { x: x0, y: hautVitrage, width: MARGE, height: hVit, fill: C.facadeClair });
  el(grp, 'rect', { x: x0 + BW - MARGE, y: hautVitrage, width: MARGE, height: hVit, fill: C.facadeClair });

  const fy = hautVitrage + 14;
  const fh = hVit - 24;
  for (let t = 0; t < G.travees; t++) {
    const fx = x0 + MARGE + t * (TRAVEE + ENTRE);

    /* la baie : un groupe nomme, pret a recevoir un bouton plus tard */
    const baie = g(grp, {
      class: 'fenetre',
      id: `fenetre-${i}-${t}`,
      'data-etage': i,
      'data-travee': t,
    });
    el(baie, 'rect', { x: fx, y: fy, width: TRAVEE, height: fh, fill: C.vitre });

    /* trois panneaux separes par deux meneaux */
    const pw = TRAVEE / 3;
    for (let p = 0; p < 3; p++) {
      if (rnd() < .42) {
        el(baie, 'rect', {
          x: (fx + p * pw).toFixed(1), y: fy, width: pw.toFixed(1), height: fh,
          fill: C.vitreClair,
        });
      }
    }
    for (let m = 1; m < 3; m++) {
      el(baie, 'rect', { x: (fx + m * pw - 1.5).toFixed(1), y: fy, width: 3, height: fh, fill: C.meneau });
    }
    /* un reflet oblique, comme dans la reference */
    el(baie, 'path', {
      d: `M${fx} ${fy + fh * .62} L${fx + TRAVEE * .46} ${fy} L${fx + TRAVEE * .78} ${fy} L${fx} ${fy + fh * .94} Z`,
      fill: C.reflet, opacity: .20,
    });
    el(baie, 'rect', { x: fx, y: fy, width: TRAVEE, height: fh, fill: 'none',
                       stroke: C.meneau, 'stroke-width': 2.5 });
  }
}

/* la dalle debordante, sa tranche d'ombre, et ce qui pousse dessus */
function dalleEtVerdure(grp, G, i, densite = 1) {
  const { BW, x0 } = G;
  /* --- la dalle, qui deborde de chaque cote --- */
  el(grp, 'rect', { x: x0 - DEBORD, y: DALLE_H, width: BW + DEBORD * 2, height: TRANCHE_H, fill: C.dalleTranche });
  el(grp, 'rect', { x: x0 - DEBORD, y: 0, width: BW + DEBORD * 2, height: DALLE_H, fill: C.dalle });
  el(grp, 'rect', { x: x0 - DEBORD, y: 0, width: BW + DEBORD * 2, height: 5, fill: C.dalleHaut });

  /* --- ce qui pousse sur la dalle --- */
  const verdure = g(grp, { class: 'verdure' });
  const ancrages = [];

  const bacs = (2 + (i % 2)) + (densite > 1 ? 2 : 0);
  for (let b = 0; b < bacs; b++) {
    const bw = rr(70, 130);
    const bx = x0 - DEBORD + 14 + (b + rr(-.18, .18)) * ((BW + DEBORD * 2 - 40) / bacs);
    el(verdure, 'rect', { x: bx.toFixed(1), y: -16, width: bw.toFixed(1), height: 18,
                          fill: C.jardiniere, rx: 2 });
    el(verdure, 'rect', { x: bx.toFixed(1), y: -16, width: bw.toFixed(1), height: 4,
                          fill: C.jardClair, rx: 2 });
    const larg = bw * 1.25;
    feuillage(verdure, bx + bw / 2, -26, larg, rr(46, 74) * densite, densite);
    ancrages.push({ x: bx + bw / 2, larg });
  }
  /* quelques massifs libres, poses a meme la dalle */
  for (let k = 0; k < 2 + (i % 2); k++) {
    const cx = x0 + rr(-10, BW + 10), larg = rr(70, 140);
    feuillage(verdure, cx, -14, larg, rr(38, 62) * densite, .8 * densite);
    ancrages.push({ x: cx, larg });
  }

  retombees(verdure, ancrages, DALLE_H + TRANCHE_H);
}

function etage(parent, i, G, Y) {
  const place = g(parent, { transform: `translate(0, ${Y})` });
  const grp = g(place, { class: 'etage', 'data-y': Y, 'data-etage': i });
  facadeVitree(grp, G, i);
  dalleEtVerdure(grp, G, i);
  return grp;
}

/* ==================================================================
 * 6. LE MONDE
 * ================================================================== */
let G, MONDE_H, CIEL_H;

function construire() {
  rnd = mulberry32(0x13A7);          // on repart du meme tirage
  G = gabarit();
  const { BW, VW, x0 } = G;

  CIEL_H = 820;
  /* le toit est un niveau entier : avec une simple dalle, il n'avait
     pas de facade en dessous et flottait au-dessus du vide, un trou de
     ciel entre lui et le premier etage. */
  const TOIT_H = FH;
  const SOL_H = 300;
  MONDE_H = CIEL_H + TOIT_H + ETAGES * FH + SOL_H;

  const svg = document.getElementById('toile');
  svg.textContent = '';
  svg.setAttribute('viewBox', `0 0 ${VW} ${Math.round(VW / (innerWidth / innerHeight))}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');

  /* --- degrade du ciel --- */
  const defs = el(svg, 'defs', {});
  const lg = el(defs, 'linearGradient', { id: 'ciel', x1: 0, y1: 0, x2: 0, y2: 1 });
  el(lg, 'stop', { offset: '0%', 'stop-color': C.cielHaut });
  el(lg, 'stop', { offset: '100%', 'stop-color': C.cielBas });

  /* le fond couvre tout le cadre, quel que soit le defilement */
  el(svg, 'rect', { id: 'fond', x: -VW, y: -MONDE_H, width: VW * 3, height: MONDE_H * 3, fill: 'url(#ciel)' });

  /* trois plans, qui ne different que par leur vitesse : le
     deplacement reste strictement vertical. */
  const planCiel = g(svg, { id: 'plan-ciel' });
  const planLoin = g(svg, { id: 'plan-loin' });
  const planPres = g(svg, { id: 'plan-pres' });

  /* --- nuages --- */
  for (const n of [{ x: VW * .22, y: 150, s: 1 }, { x: VW * .74, y: 330, s: .72 }, { x: VW * .45, y: 560, s: .5 }]) {
    const nu = g(planCiel, { class: 'nuage' });
    nu.style.animation = `derive ${rr(70, 110).toFixed(0)}s linear infinite`;
    for (let i = 0; i < 6; i++) {
      el(nu, 'circle', {
        cx: (n.x + rr(-110, 110) * n.s).toFixed(1),
        cy: (n.y + rr(-16, 16) * n.s).toFixed(1),
        r: (rr(26, 54) * n.s).toFixed(1),
        fill: C.nuage, opacity: .9,
      });
    }
  }

  /* --- les oiseaux ---
     Poses au milieu du ciel et non en bordure : a l'arret, ou en
     mouvement reduit, l'animation ne joue pas et un oiseau cale a
     gauche du cadre restait invisible. */
  const oiseau = g(planCiel, { class: 'oiseau' });
  oiseau.style.animation = 'vole 30s linear infinite';
  const trait = (parent, x, y, ech, op) => el(parent, 'path', {
    d: `M${x} ${y} q ${7 * ech} ${-6 * ech} ${14 * ech} 0 q ${7 * ech} ${-6 * ech} ${14 * ech} 0`,
    stroke: C.oiseau, 'stroke-width': (2.6 * ech).toFixed(1),
    fill: 'none', 'stroke-linecap': 'round', opacity: op,
  });
  trait(oiseau, VW * .18, 300, 1.15, 1);
  trait(oiseau, VW * .18 + 54, 338, .78, .62);
  trait(oiseau, VW * .18 - 38, 352, .62, .45);

  /* --- la ville au loin, posee sur la ligne d'horizon --- */
  const horizon = CIEL_H + TOIT_H + ETAGES * FH + 120;
  for (const [col, nb, hmin, hmax, larg] of [
    [C.tourLoin, 9, 240, 620, 86],
    [C.tourMoyen, 7, 180, 440, 70],
    [C.tourProche, 5, 120, 300, 58],
  ]) {
    for (let i = 0; i < nb; i++) {
      const w = larg * rr(.6, 1.25);
      const h = rr(hmin, hmax);
      const x = rr(-VW * .15, VW * 1.15);
      /* on evite le centre, ou se tient l'immeuble */
      if (x + w > x0 - 70 && x < x0 + BW + 70) continue;
      el(planLoin, 'rect', { x: x.toFixed(1), y: (horizon - h).toFixed(1), width: w.toFixed(1), height: h.toFixed(1), fill: col });
    }
  }

  /* --- le sol --- */
  const solY = CIEL_H + TOIT_H + ETAGES * FH;
  el(planPres, 'rect', { x: -VW, y: solY + 110, width: VW * 3, height: 60, fill: C.sol });
  el(planPres, 'rect', { x: -VW, y: solY + 170, width: VW * 3, height: 36, fill: C.trottoir });
  el(planPres, 'rect', { x: -VW, y: solY + 206, width: VW * 3, height: SOL_H, fill: C.rue });
  /* bordure du trottoir et marquage au sol */
  el(planPres, 'rect', { x: -VW, y: solY + 206, width: VW * 3, height: 5, fill: C.trottoir });
  for (let i = -3; i < 14; i++) {
    el(planPres, 'rect', { x: (i * (VW / 7) + 20).toFixed(1), y: solY + 262, width: (VW / 16).toFixed(1),
                           height: 7, fill: C.sol, opacity: .75 });
  }

  /* --- l'immeuble --- */
  const immeuble = g(planPres, { id: 'immeuble' });

  /* le toit-terrasse : un niveau comme les autres, plus le volume
     technique pose dessus et une vegetation plus dense. */
  const placeToit = g(immeuble, { transform: `translate(0, ${CIEL_H})` });
  const toit = g(placeToit, { class: 'etage', 'data-y': CIEL_H, 'data-etage': -1 });
  el(toit, 'rect', { x: x0 + BW * .36, y: -62, width: BW * .30, height: 62, fill: C.toit });
  el(toit, 'rect', { x: x0 + BW * .36, y: -62, width: BW * .30, height: 7, fill: C.toitClair });
  facadeVitree(toit, G, 0);
  dalleEtVerdure(toit, G, 1, 1.25);

  /* les etages, du haut vers le bas */
  for (let i = 0; i < ETAGES; i++) {
    etage(immeuble, i, G, CIEL_H + TOIT_H + i * FH);
  }

  /* le rez-de-chaussee : un socle plus clair et une entree */
  const ySocle = CIEL_H + TOIT_H + ETAGES * FH;
  const placeSocle = g(immeuble, { transform: `translate(0, ${ySocle})` });
  const socle = g(placeSocle, { class: 'etage', 'data-y': ySocle, 'data-etage': ETAGES });
  el(socle, 'rect', { x: x0, y: 0, width: BW, height: 110, fill: C.facade });
  el(socle, 'rect', { x: x0 + BW / 2 - 52, y: 24, width: 104, height: 86, fill: C.vitreClair });
  el(socle, 'rect', { x: x0 + BW / 2 - 2, y: 24, width: 4, height: 86, fill: C.meneau });

  /* --- les arbres de la rue, devant le socle --- */
  const arbres = g(planPres, { class: 'etage', 'data-y': solY, 'data-etage': ETAGES + 1 });
  const verdArbres = g(arbres, { class: 'verdure' });
  for (let i = 0; i < 9; i++) {
    const ax = rr(-VW * .08, VW * 1.08);
    if (ax > x0 + BW * .3 && ax < x0 + BW * .7) continue;   /* on degage l'entree */
    const ah = rr(90, 165);
    el(verdArbres, 'rect', { x: (ax - 5).toFixed(1), y: (solY + 120 - ah * .35).toFixed(1),
                             width: 10, height: (ah * .45).toFixed(1), fill: C.jardiniere });
    feuillage(verdArbres, ax, solY + 100 - ah * .5, ah * 1.15, ah * .8, 1.2);
  }

  /* --- mesure du defilement --- */
  /* le ciel seul a droit a la parallaxe : nuages et oiseau n'ont aucun
     point d'ancrage au sol. La ville, elle, est POSEE sur l'horizon ;
     la faire glisser plus lentement la decalait du trottoir et elle
     n'entrait jamais dans le cadre. */
  const viteCiel = .32, viteLoin = 1;
  const vue = () => +svg.viewBox.baseVal.height;
  document.getElementById('defilement').style.height =
    Math.max(300, Math.min(900, (MONDE_H / vue()) * 100)) + 'vh';

  return { svg, planCiel, planLoin, planPres, viteCiel, viteLoin };
}

/* ==================================================================
 * 7. LE DEFILEMENT
 *    Strictement vertical : seule la coordonnee y bouge. Les trois
 *    plans avancent a des vitesses differentes, ce qui donne la
 *    profondeur sans jamais faire pivoter quoi que ce soit.
 * ================================================================== */
const reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;
let vue = construire();
let camY = null, cible = 0;

const barre = document.querySelector('#progression i');
const compteur = document.getElementById('compteur');
const indice = document.getElementById('indice');
let etagesDom = [...document.querySelectorAll('.etage')];

function lireDefilement() {
  const max = document.documentElement.scrollHeight - innerHeight;
  const t = max > 0 ? Math.min(Math.max(scrollY / max, 0), 1) : 0;
  const hVue = +vue.svg.viewBox.baseVal.height;
  cible = t * Math.max(0, MONDE_H - hVue);
}

function nommeEtage(y, hVue) {
  const centre = y + hVue / 2;
  const solY = CIEL_H + FH + ETAGES * FH;
  if (centre < CIEL_H - 40) return 'Ciel';
  /* des que le trottoir occupe le bas du cadre, on est dans la rue :
     se fier au seul centre du cadre annoncait encore un etage alors que
     le sol remplissait la moitie de l'image. */
  if (y + hVue * .80 > solY) return 'Rue';
  const i = Math.floor((centre - CIEL_H - FH) / FH);
  if (i < 0) return 'Toit-terrasse';
  if (i >= ETAGES) return 'Rue';
  return `Étage <b>${ETAGES - i}</b>`;
}

function image() {
  if (camY === null) camY = cible;
  else camY += (cible - camY) * (reduit ? 1 : .12);

  vue.planPres.setAttribute('transform', `translate(0, ${(-camY).toFixed(2)})`);
  vue.planLoin.setAttribute('transform', `translate(0, ${(-camY * vue.viteLoin).toFixed(2)})`);
  vue.planCiel.setAttribute('transform', `translate(0, ${(-camY * vue.viteCiel).toFixed(2)})`);

  const hVue = +vue.svg.viewBox.baseVal.height;

  /* le dessin etage par etage : un etage se pose quand il entre */
  for (const e of etagesDom) {
    e.classList.toggle('vu', +e.dataset.y < camY + hVue * .94);
  }

  const max = Math.max(1, MONDE_H - hVue);
  barre.style.transform = `scaleX(${(camY / max).toFixed(4)})`;
  compteur.innerHTML = nommeEtage(camY, hVue);
  indice.style.opacity = camY > hVue * .3 ? 0 : 1;

  requestAnimationFrame(image);
}

/* le gabarit change avec le format : on redessine seulement quand le
   nombre de travees bouge, pas a chaque pixel de redimensionnement. */
let travuesCourantes = G.travees;
let minuteur;
addEventListener('resize', () => {
  clearTimeout(minuteur);
  minuteur = setTimeout(() => {
    const nouveau = gabarit();
    if (nouveau.travees !== travuesCourantes) {
      vue = construire();
      travuesCourantes = nouveau.travees;
      etagesDom = [...document.querySelectorAll('.etage')];
    } else {
      const svg = document.getElementById('toile');
      svg.setAttribute('viewBox', `0 0 ${G.VW} ${Math.round(G.VW / (innerWidth / innerHeight))}`);
      document.getElementById('defilement').style.height =
        Math.max(300, Math.min(900, (MONDE_H / +svg.viewBox.baseVal.height) * 100)) + 'vh';
    }
    lireDefilement();
  }, 160);
});
addEventListener('scroll', lireDefilement, { passive: true });

lireDefilement();
image();

/* ==================================================================
 * 8. POINT D'ACCROCHE POUR LES BOUTONS A VENIR
 *    Chaque baie est deja un element du DOM, avec son identifiant et
 *    son etage. Brancher un panneau de texte plus tard ne demandera
 *    pas de toucher au dessin :
 *
 *      immeuble.fenetres.forEach(f => f.addEventListener('click', ...))
 *
 *    f.dataset.etage et f.dataset.travee disent de quelle baie il
 *    s'agit. Les attributs d'accessibilite (role, tabindex, libelle)
 *    seront ajoutes en meme temps que l'action : une fenetre qui ne
 *    fait rien ne doit pas s'annoncer comme un bouton.
 * ================================================================== */
window.immeuble = {
  get fenetres() { return [...document.querySelectorAll('.fenetre')]; },
  get camY() { return camY; },
  MONDE_H, ETAGES, FH,
};

/* animations du ciel, injectees ici pour rester avec leur scene */
const style = document.createElement('style');
style.textContent = `
  @keyframes vole {
    0%   { transform: translate(${(-G.VW * .42).toFixed(0)}px, 46px); }
    50%  { transform: translate(${(G.VW * .22).toFixed(0)}px, -26px); }
    100% { transform: translate(${(G.VW * .88).toFixed(0)}px, 34px); }
  }
  @keyframes derive {
    0%   { transform: translate(-40px, 0); }
    100% { transform: translate(40px, 0); }
  }`;
document.head.appendChild(style);
</script>
</body>
</html>
