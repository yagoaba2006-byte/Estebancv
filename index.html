<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'immeuble</title>
<meta name="description" content="Une maison de ville plantée, dessinée en vue trois quarts, qui se découvre étage par étage à mesure que l'on descend du ciel.">
<meta name="theme-color" content="#cfe4ea">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23dcebee'/><path d='M8 12h12v15H8z' fill='%2389bfad' stroke='%233c4a48' stroke-width='1.6'/><path d='M20 9l6 3v15l-6-2z' fill='%235f8478' stroke='%233c4a48' stroke-width='1.6'/><path d='M8 12l5-4 7 1-6 3z' fill='%23f3cc8e' stroke='%233c4a48' stroke-width='1.6'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ciel-haut:#cfe4ea;
    --ciel-bas:#eef5f3;
    --encre:#2e3a38;
    --encre-douce:#56655f;
    --filet:rgba(46,58,56,.18);
    --gouttiere:3vw;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{
    background:var(--ciel-bas);
    color:var(--encre);
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    font-size:clamp(.92rem,.86rem + .25vw,1rem);
    line-height:1.6;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(100,122,78,.22)}

  #scene{position:sticky;top:0;height:100vh;height:100svh;width:100%;z-index:0}
  #scene svg{display:block;width:100%;height:100%}
  #defilement{position:relative;z-index:1;pointer-events:none}

  /* ---- chrome, volontairement discret ---- */
  #entete{
    position:fixed;left:0;right:0;top:0;z-index:3;
    display:flex;align-items:baseline;justify-content:space-between;
    gap:1.5rem;padding:1.3rem var(--gouttiere);pointer-events:none;
  }
  #entete::before{
    content:"";position:absolute;left:0;right:0;top:0;bottom:-34px;z-index:-1;
    background:linear-gradient(180deg,rgba(238,245,243,.94) 0%,rgba(238,245,243,.6) 46%,rgba(238,245,243,0) 100%);
  }
  .marque{font-weight:600;font-size:.98rem;letter-spacing:.01em}
  .meta{font-size:.64rem;font-weight:500;letter-spacing:.17em;
        text-transform:uppercase;color:var(--encre-douce);text-align:right}

  #voile-bas{
    position:fixed;left:0;right:0;bottom:0;height:74px;z-index:2;pointer-events:none;
    background:linear-gradient(0deg,rgba(238,245,243,.86) 0%,rgba(238,245,243,.42) 48%,rgba(238,245,243,0) 100%);
  }

  #indice{
    position:fixed;left:var(--gouttiere);bottom:1.4rem;z-index:3;
    display:flex;flex-direction:column;align-items:flex-start;gap:.7rem;
    font-size:.64rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
    color:var(--encre-douce);pointer-events:none;transition:opacity .5s ease;
  }
  #indice .rail{position:relative;width:1px;height:40px;background:var(--filet);overflow:hidden}
  #indice .rail::after{content:"";position:absolute;left:0;top:0;width:1px;height:13px;
    background:#647a4e;animation:descend 2.2s cubic-bezier(.5,0,.5,1) infinite}
  @keyframes descend{0%{transform:translateY(-110%)}100%{transform:translateY(320%)}}

  #compteur{
    position:fixed;right:var(--gouttiere);bottom:1.4rem;z-index:3;
    font-size:.64rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
    color:var(--encre-douce);font-variant-numeric:tabular-nums;pointer-events:none;
  }
  #compteur b{color:var(--encre);font-weight:600}

  #progression{position:fixed;left:0;right:0;bottom:0;z-index:3;height:2px;
    background:rgba(46,58,56,.08);pointer-events:none}
  #progression i{display:block;height:100%;width:100%;background:#647a4e;
    transform:scaleX(0);transform-origin:0 50%}

  /* ================================================================
     Le dessin niveau par niveau. La position dans le monde est portee
     par l'ATTRIBUT transform du SVG, l'animation par la PROPRIETE
     transform du CSS : sur un meme element la seconde ecrase la
     premiere et le niveau perd sa place.
     ================================================================ */
  .niveau{opacity:0;transform:translate(0,34px);
    transition:opacity .6s ease,transform .6s cubic-bezier(.22,.68,.16,1)}
  .niveau.vu{opacity:1;transform:translate(0,0)}
  .niveau .verdure{opacity:0;transform:translate(0,16px);
    transition:opacity .66s ease .18s,transform .66s cubic-bezier(.22,.68,.16,1) .18s}
  .niveau.vu .verdure{opacity:1;transform:translate(0,0)}

  /* ---- les fenetres, pretes pour les boutons ---- */
  .fenetre .halo{opacity:0;transition:opacity .18s ease}
  .fenetre .dormant{transition:fill .18s ease}
  .fenetre.cliquable{cursor:pointer}
  .fenetre.cliquable:hover .halo,
  .fenetre.cliquable:focus-visible .halo{opacity:1}
  .fenetre.cliquable:hover .dormant,
  .fenetre.cliquable:focus-visible .dormant{fill:#fff6e4}
  .fenetre:focus{outline:none}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    #indice .rail::after{animation:none;height:40px;opacity:.5}
    .niveau,.niveau .verdure{transition:none}
    .oiseau,.nuage{animation:none !important}
  }
  @media (max-width:700px){
    :root{--gouttiere:5vw}
    .meta{display:none}
  }
</style>
</head>
<body>

<header id="entete">
  <div class="marque">L'immeuble</div>
  <p class="meta">Trois étages, dessinés un à un</p>
</header>

<div id="scene"><svg id="toile" role="img" aria-label="Illustration d'une maison de ville plantée, vue en trois quarts, du ciel jusqu'à la rue"></svg></div>
<div id="defilement" aria-hidden="true"></div>
<div id="voile-bas" aria-hidden="true"></div>

<div id="indice" aria-hidden="true">
  <span>Descendre</span><span class="rail"></span>
</div>
<p id="compteur" aria-hidden="true">Ciel</p>
<div id="progression" aria-hidden="true"><i></i></div>

<script type="module">
/* ==================================================================
 * 1. PALETTE
 *    Relevee par echantillonnage de l'illustration de reference.
 *    Chaque volume porte trois valeurs : la face vue de face, le cote
 *    droit plus sombre, le dessus plus clair. C'est ce triplet, et lui
 *    seul, qui donne le relief — il n'y a aucun calcul de lumiere.
 * ================================================================== */
const C = {
  trait:      '#3c4a48',
  traitFin:   '#56655f',
  garde:      '#45544b',

  cielHaut:   '#cfe4ea',
  cielBas:    '#eef5f3',
  nuage:      '#ffffff',
  oiseau:     '#4c5b58',

  vitre:      '#cfd9d4',
  vitreHaut:  '#e3eae6',
  chaud:      '#f1e0c6',
  chaudVif:   '#f8d79b',
  brun:       '#85705a',
  brunClair:  '#a0866c',
  souche:     '#c08a68',

  vertClair:  '#9cbb6e',
  vertMoyen:  '#647a4e',
  vertSombre: '#44582f',
  terre:      '#9a6b4d',

  sol:        '#dfe7e2',
  trottoir:   '#cad6ce',
  rue:        '#b6c4bd',
  buisson:    '#7c9a5c',
};
const VOL = {
  turquoise:  { face: '#89bfad', cote: '#5f8478', dessus: '#a7d4c4' },
  turquoiseF: { face: '#7ab3a2', cote: '#516a5f', dessus: '#93c6b5' },
  jaune:      { face: '#f3cc8e', cote: '#c5a06b', dessus: '#fbe0ae' },
  corail:     { face: '#e6996e', cote: '#b97550', dessus: '#f3b48e' },
  dalle:      { face: '#f4f1ea', cote: '#d6d1c4', dessus: '#ffffff' },
  toiture:    { face: '#6fa797', cote: '#4e6e64', dessus: '#8dc0b0' },
};

/* ==================================================================
 * 2. OUTILS
 * ================================================================== */
const NS = 'http://www.w3.org/2000/svg';

function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rnd = mulberry32(0x2C1F);
const rr = (a, b) => a + (b - a) * rnd();
const ri = (a, b) => Math.floor(rr(a, b + 1));

function el(parent, nom, attrs) {
  const n = document.createElementNS(NS, nom);
  for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) n.setAttribute(k, attrs[k]);
  parent.appendChild(n);
  return n;
}
const g = (parent, attrs) => el(parent, 'g', attrs || {});

/* ==================================================================
 * 3. LA PROJECTION
 *    Axonometrie oblique : z part vers le fond, c'est-a-dire vers la
 *    droite et vers le haut de l'ecran. On voit donc la face avant, le
 *    cote droit et les dessus — exactement les trois faces de la
 *    reference. Les verticales restent verticales, rien ne fuit.
 * ================================================================== */
const DX = .46, DY = .27;
const px = (x, z) => x + z * DX;
const py = (y, z) => y - z * DY;
const pt = (x, y, z) => `${px(x, z).toFixed(1)},${py(y, z).toFixed(1)}`;

function face(parent, coins, fill, opt = {}) {
  return el(parent, 'polygon', {
    points: coins.map(c => pt(c[0], c[1], c[2])).join(' '),
    fill,
    stroke: opt.trait === null ? undefined : (opt.trait || C.trait),
    'stroke-width': opt.ep ?? 3,
    'stroke-linejoin': 'round',
    class: opt.class,
  });
}

/* une boite : dessus, cote droit, face avant, dans cet ordre — la face
   avant est la plus proche, donc la derniere posee. */
function boite(parent, x, y, z, w, h, d, t, opt = {}) {
  const x1 = x + w, y1 = y + h, z1 = z + d;
  const b = g(parent, opt.attrs);
  if (opt.dessus !== false) face(b, [[x, y, z], [x1, y, z], [x1, y, z1], [x, y, z1]], t.dessus, opt);
  face(b, [[x1, y, z], [x1, y, z1], [x1, y1, z1], [x1, y1, z]], t.cote, opt);
  face(b, [[x, y, z], [x1, y, z], [x1, y1, z], [x, y1, z]], t.face, opt);
  return b;
}

function ligne(parent, a, b, col, ep) {
  return el(parent, 'line', {
    x1: px(a[0], a[2]).toFixed(1), y1: py(a[1], a[2]).toFixed(1),
    x2: px(b[0], b[2]).toFixed(1), y2: py(b[1], b[2]).toFixed(1),
    stroke: col || C.trait, 'stroke-width': ep ?? 3, 'stroke-linecap': 'round',
  });
}

/* ==================================================================
 * 4. VEGETATION
 *    Des masses bombees, batites d'ellipses qui se chevauchent, avec
 *    un contour unique pose par-dessous : chaque ellipse cerclee
 *    aurait fait apparaitre les traits interieurs.
 * ================================================================== */
function feuillage(parent, cx, cy, larg, haut, dens = 1) {
  const m = g(parent, {});
  const lobes = [];
  const couches = [
    { col: C.vertSombre, n: Math.round(4 * dens), dx:  .12, dy:  .14, r: [.30, .46] },
    { col: C.vertMoyen,  n: Math.round(5 * dens), dx:  .00, dy: -.04, r: [.26, .40] },
    { col: C.vertClair,  n: Math.round(4 * dens), dx: -.16, dy: -.22, r: [.18, .30] },
  ];
  for (const c of couches) for (let i = 0; i < c.n; i++) {
    const r = haut * rr(c.r[0], c.r[1]);
    lobes.push({
      cx: cx + (c.dx + rr(-.30, .30)) * larg,
      cy: cy + c.dy * haut + rr(-.12, .12) * haut,
      rx: r, ry: r * rr(.76, .95), col: c.col,
    });
  }
  /* le contour : les memes lobes, en plus gros, sans remplissage */
  for (const l of lobes) {
    el(m, 'ellipse', { cx: l.cx.toFixed(1), cy: l.cy.toFixed(1),
                       rx: (l.rx + 2.2).toFixed(1), ry: (l.ry + 2.2).toFixed(1), fill: C.trait });
  }
  for (const l of lobes) {
    el(m, 'ellipse', { cx: l.cx.toFixed(1), cy: l.cy.toFixed(1),
                       rx: l.rx.toFixed(1), ry: l.ry.toFixed(1), fill: l.col });
  }
  return m;
}

/* un bac et sa plante, poses a plat sur un balcon */
function bac(parent, x, y, z, larg) {
  const h = 26, prof = 34;
  boite(parent, x, y - h, z, larg, h, prof, { face: C.terre, cote: '#7d5339', dessus: '#b07f5c' }, { ep: 2.6 });
  feuillage(parent, px(x + larg / 2, z + prof / 2), py(y - h - 14, z + prof / 2),
            larg * 1.15, rr(42, 62), 1);
}

/* ==================================================================
 * 5. LE GABARIT
 * ================================================================== */
const H = 232;                 /* hauteur d'un niveau            */
const NIVEAUX = 3;             /* trois etages, plus le rez      */
const TOIT_H = 150, RDC_H = 196, BALCON = 74, DALLE_H = 15, GARDE_H = 56;
const PROF = 176;              /* profondeur du bati             */

/* chaque niveau a sa teinte, sa largeur et son decalage : c'est ce
   decrochement qui donne l'empilement de volumes de la reference. */
const PLAN = [
  { x:  26, w: 286, t: VOL.turquoise },
  { x:   0, w: 330, t: VOL.jaune },
  { x:  16, w: 312, t: VOL.corail },
];
const RDC = { x: 6, w: 330, t: VOL.turquoiseF };
const EMPRISE = 336;

function gabarit() {
  const ratio = innerWidth / innerHeight;
  /* largeur occupee a l'ecran, overhangs et fuyante compris */
  const BW = EMPRISE + PROF * DX + BALCON * DX + 40;
  const part = ratio > 1.3 ? .56 : ratio > .8 ? .70 : .94;
  const VW = Math.round(BW / part);
  return { BW, VW, x0: Math.round((VW - BW) / 2 + BALCON * DX) };
}

/* ==================================================================
 * 6. UN NIVEAU
 * ================================================================== */
function fenetre(parent, i, k, fx, fy, fw, fh, z, allumee) {
  const b = g(parent, { class: 'fenetre', id: `fenetre-${i}-${k}`,
                        'data-etage': i, 'data-travee': k });
  const X = px(fx, z), Y = py(fy, z);

  /* le dormant clair, qui detache la baie de la facade coloree */
  el(b, 'rect', { class: 'dormant', x: (X - 7).toFixed(1), y: (Y - 7).toFixed(1),
                  width: fw + 14, height: fh + 14, rx: 3,
                  fill: C.vitreHaut, stroke: C.trait, 'stroke-width': 3 });
  el(b, 'rect', { x: X.toFixed(1), y: Y.toFixed(1), width: fw, height: fh,
                  fill: allumee ? C.chaudVif : C.vitre,
                  stroke: C.trait, 'stroke-width': 2.6 });

  if (allumee) {
    /* une plante en pot derriere la vitre : on devine quelqu'un */
    const sx = X + fw * (k % 2 ? .28 : .72), sy = Y + fh - 12;
    el(b, 'path', { d: `M${(sx - 8).toFixed(1)} ${(sy - 14).toFixed(1)} h16 l-2 14 h-12 Z`, fill: C.brun });
    for (let n = 0; n < 4; n++) {
      const a = -Math.PI / 2 + (n - 1.5) * .46, lg = rr(13, 21);
      const ex = sx + Math.cos(a) * lg * .55, ey = sy - 14 + Math.sin(a) * lg * .5;
      el(b, 'ellipse', { cx: ex.toFixed(1), cy: ey.toFixed(1),
                         rx: rr(4, 6).toFixed(1), ry: (lg * .4).toFixed(1), fill: C.vertMoyen,
                         transform: `rotate(${(a * 180 / Math.PI + 90).toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)})` });
    }
  }
  /* un meneau et une traverse : la baie se lit comme une menuiserie */
  el(b, 'line', { x1: (X + fw / 2).toFixed(1), y1: Y.toFixed(1),
                  x2: (X + fw / 2).toFixed(1), y2: (Y + fh).toFixed(1),
                  stroke: C.trait, 'stroke-width': 2.6 });
  el(b, 'line', { x1: X.toFixed(1), y1: (Y + fh * .42).toFixed(1),
                  x2: (X + fw).toFixed(1), y2: (Y + fh * .42).toFixed(1),
                  stroke: C.trait, 'stroke-width': 2.2 });
  /* l'appui */
  el(b, 'rect', { x: (X - 12).toFixed(1), y: (Y + fh + 7).toFixed(1), width: fw + 24, height: 9,
                  rx: 2, fill: VOL.dalle.face, stroke: C.trait, 'stroke-width': 2.6 });
  /* le halo de survol, invisible au repos */
  el(b, 'rect', { class: 'halo', x: (X - 15).toFixed(1), y: (Y - 15).toFixed(1),
                  width: fw + 30, height: fh + 42, rx: 6,
                  fill: C.vertClair, 'fill-opacity': .16,
                  stroke: C.vertMoyen, 'stroke-width': 6 });
  return b;
}

function gardeCorps(parent, x, y, z, w, d) {
  const q = g(parent, {});
  const yh = y - GARDE_H;
  /* lisse basse et haute, sur l'avant puis sur le cote droit */
  for (const [a, b] of [[[x, y, z], [x + w, y, z]], [[x, yh, z], [x + w, yh, z]],
                        [[x + w, y, z], [x + w, y, z + d]], [[x + w, yh, z], [x + w, yh, z + d]]]) {
    ligne(q, a, b, C.garde, 4);
  }
  for (let bx = x + 10; bx < x + w - 4; bx += 21) ligne(q, [bx, y, z], [bx, yh, z], C.garde, 3);
  for (let bz = z + 14; bz < z + d - 4; bz += 21) ligne(q, [x + w, y, bz], [x + w, yh, bz], C.garde, 3);
  return q;
}

function niveau(parent, i, G, Y) {
  const { x0 } = G;
  const p = PLAN[i];
  const bx = x0 + p.x, bas = Y + H;

  const place = g(parent, { transform: `translate(0, ${Y})` });
  const n = g(place, { class: 'niveau', 'data-y': Y, 'data-etage': i });

  /* 1. le volume habite */
  boite(n, bx, 0, 0, p.w, H, PROF, p.t);

  /* 2. deux baies sur la face avant */
  const fw = Math.round((p.w - 76) / 2) - 16, fh = H - 118;
  for (let k = 0; k < 2; k++) {
    fenetre(n, i, k, bx + 30 + k * (fw + 44), 34, fw, fh, 0, (i + k) % 3 !== 1);
  }
  /* 3. une baie sur le cote droit, en fuyante — decor, pas une cible */
  face(n, [[bx + p.w, 44, 36], [bx + p.w, 44, 36 + 74], [bx + p.w, 44 + fh * .8, 36 + 74],
           [bx + p.w, 44 + fh * .8, 36]], C.vitre, { ep: 2.6 });

  /* 4. la dalle du balcon, qui deborde vers l'avant et sur la droite */
  const dx0 = bx - 14, dw = p.w + 28;
  boite(n, dx0, H - DALLE_H, -BALCON, dw, DALLE_H, BALCON + PROF + 14, VOL.dalle, { ep: 3 });

  /* 5. le garde-corps */
  gardeCorps(n, dx0, H - DALLE_H, -BALCON, dw, BALCON);

  /* 6. ce qui pousse sur le balcon */
  const v = g(n, { class: 'verdure' });
  const nbBacs = 2 + (i % 2);
  for (let b = 0; b < nbBacs; b++) {
    const lg = rr(54, 88);
    bac(v, dx0 + 16 + b * ((dw - 70) / nbBacs), H - DALLE_H, -BALCON + 18, lg);
  }
  bac(v, bx + p.w - 10, H - DALLE_H, -BALCON + 26, 46);

  return n;
}

/* ==================================================================
 * 7. LE MONDE
 * ================================================================== */
let G, MONDE_H, CIEL_H, SOL_Y;

function construire() {
  rnd = mulberry32(0x2C1F);
  G = gabarit();
  const { VW, x0 } = G;

  CIEL_H = 720;
  const HAUT_BATI = CIEL_H + TOIT_H;
  SOL_Y = HAUT_BATI + NIVEAUX * H + RDC_H;
  const SOL_H = 330;
  MONDE_H = SOL_Y + SOL_H;

  const svg = document.getElementById('toile');
  svg.textContent = '';
  svg.setAttribute('viewBox', `0 0 ${VW} ${Math.round(VW / (innerWidth / innerHeight))}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');

  const defs = el(svg, 'defs', {});
  const lg = el(defs, 'linearGradient', { id: 'ciel', x1: 0, y1: 0, x2: 0, y2: 1 });
  el(lg, 'stop', { offset: '0%', 'stop-color': C.cielHaut });
  el(lg, 'stop', { offset: '100%', 'stop-color': C.cielBas });
  el(svg, 'rect', { x: -VW, y: -MONDE_H, width: VW * 3, height: MONDE_H * 3, fill: 'url(#ciel)' });

  const planCiel = g(svg, { id: 'plan-ciel' });
  const planPres = g(svg, { id: 'plan-pres' });

  /* --- nuages, cernes comme le reste du dessin --- */
  for (const n of [{ x: VW * .24, y: 150, s: 1 }, { x: VW * .76, y: 330, s: .74 }, { x: VW * .46, y: 520, s: .54 }]) {
    const nu = g(planCiel, { class: 'nuage' });
    nu.style.animation = `derive ${rr(74, 112).toFixed(0)}s linear infinite`;
    const lobes = [];
    for (let i = 0; i < 6; i++) {
      lobes.push({ cx: n.x + rr(-98, 98) * n.s, cy: n.y + rr(-12, 12) * n.s, r: rr(27, 50) * n.s });
    }
    for (const l of lobes) el(nu, 'circle', { cx: l.cx.toFixed(1), cy: l.cy.toFixed(1), r: (l.r + 3).toFixed(1), fill: C.trait, opacity: .22 });
    for (const l of lobes) el(nu, 'circle', { cx: l.cx.toFixed(1), cy: l.cy.toFixed(1), r: l.r.toFixed(1), fill: C.nuage });
  }

  /* --- les oiseaux, poses au milieu du ciel --- */
  const oiseau = g(planCiel, { class: 'oiseau' });
  oiseau.style.animation = 'vole 30s linear infinite';
  const trait = (x, y, e, op) => el(oiseau, 'path', {
    d: `M${x} ${y} q ${7 * e} ${-6 * e} ${14 * e} 0 q ${7 * e} ${-6 * e} ${14 * e} 0`,
    stroke: C.oiseau, 'stroke-width': (3 * e).toFixed(1), fill: 'none', 'stroke-linecap': 'round', opacity: op,
  });
  trait(VW * .20, 286, 1.2, 1); trait(VW * .20 + 58, 326, .8, .6); trait(VW * .20 - 40, 342, .64, .44);

  /* --- le sol --- */
  /* Le sol est un PLAN qui fuit vers le fond, pas une bande plate :
     une bande horizontale se lisait comme un mur et le batiment
     semblait pose sur rien. */
  face(planPres, [[-VW, SOL_Y, -420], [VW * 2, SOL_Y, -420], [VW * 2, SOL_Y, 520], [-VW, SOL_Y, 520]],
       C.sol, { trait: null });
  const bordY = py(SOL_Y, -420);
  el(planPres, 'rect', { x: -VW, y: bordY, width: VW * 3, height: 42, fill: C.trottoir });
  el(planPres, 'rect', { x: -VW, y: bordY + 42, width: VW * 3, height: MONDE_H, fill: C.rue });
  el(planPres, 'line', { x1: -VW, y1: bordY, x2: VW * 2, y2: bordY, stroke: C.trait, 'stroke-width': 3 });
  el(planPres, 'line', { x1: -VW, y1: bordY + 42, x2: VW * 2, y2: bordY + 42, stroke: C.trait, 'stroke-width': 3 });
  for (let i = -2; i < 12; i++) {
    el(planPres, 'rect', { x: (i * (VW / 6) + 26).toFixed(1), y: bordY + 112,
                           width: (VW / 14).toFixed(1), height: 9, rx: 4, fill: C.sol, opacity: .85 });
  }

  const bati = g(planPres, { id: 'bati' });

  /* ------------------------------------------------------------------
     ORDRE DE TRACE : du bas vers le haut.
     En axonometrie, un volume pose sur un autre doit etre peint APRES
     lui, sinon le dessus du volume inferieur recouvre le niveau qui
     s'appuie dessus — et avec lui son garde-corps. C'est l'algorithme
     du peintre : le plus proche en dernier.
     ------------------------------------------------------------------ */
  const yR = HAUT_BATI + NIVEAUX * H;

  /* --- le rez-de-chaussee : vitrine, porte vitree, auvent --- */
  const placeR = g(bati, { transform: `translate(0, ${yR})` });
  const rez = g(placeR, { class: 'niveau', 'data-y': yR, 'data-etage': NIVEAUX });
  const rx = x0 + RDC.x;
  boite(rez, rx, 0, 0, RDC.w, RDC_H, PROF, RDC.t);
  const ex = rx + RDC.w * .42;
  el(rez, 'rect', { x: (px(ex, 0) - 2).toFixed(1), y: (py(46, 0)).toFixed(1), width: 94, height: RDC_H - 46,
                    fill: C.chaud, stroke: C.trait, 'stroke-width': 3 });
  el(rez, 'line', { x1: (px(ex, 0) + 46).toFixed(1), y1: py(46, 0).toFixed(1),
                    x2: (px(ex, 0) + 46).toFixed(1), y2: py(RDC_H, 0).toFixed(1),
                    stroke: C.trait, 'stroke-width': 2.6 });
  el(rez, 'rect', { x: (px(ex, 0) - 16).toFixed(1), y: (py(46, 0) - 15).toFixed(1), width: 124, height: 15,
                    rx: 3, fill: VOL.dalle.face, stroke: C.trait, 'stroke-width': 3 });
  el(rez, 'rect', { x: (px(rx + 28, 0)).toFixed(1), y: (py(64, 0)).toFixed(1), width: 86, height: RDC_H - 108,
                    fill: C.vitre, stroke: C.trait, 'stroke-width': 3 });

  /* l'escalier exterieur, sur la droite */
  /* Un perron devant la porte plutot qu'une volee laterale : vue de
     face, l'escalier sur le flanc se lisait comme une pile de cubes
     blancs suspendus. Trois marches qui avancent vers le spectateur se
     comprennent d'un coup d'oeil. */
  const perron = g(rez, { class: 'verdure' });
  for (let m = 0; m < 3; m++) {
    const lg = 122 + m * 22;
    boite(perron, ex - 14 - m * 11, RDC_H - 22 + m * 11, -16 - m * 22, lg, 22, 22,
          { face: VOL.dalle.face, cote: VOL.dalle.cote, dessus: VOL.dalle.dessus }, { ep: 2.6 });
  }
  /* deux bacs encadrent l'entree */
  bac(perron, ex - 92, RDC_H, -40, 54);
  bac(perron, ex + 108, RDC_H, -40, 54);

  /* --- les trois niveaux, du plus bas au plus haut --- */
  for (let i = NIVEAUX - 1; i >= 0; i--) niveau(bati, i, G, HAUT_BATI + i * H);

  /* --- la toiture, posee en dernier : deux pans et une souche --- */
  const placeToit = g(bati, { transform: `translate(0, ${CIEL_H})` });
  const toit = g(placeToit, { class: 'niveau', 'data-y': CIEL_H, 'data-etage': -1 });
  const tx = x0 + PLAN[0].x - 16, tw = PLAN[0].w + 32, td = PROF + 28;
  /* La pente doit depasser largement la montee due a la profondeur :
     en projection, avancer de zf vers le fond remonte deja de
     zf * DY a l'ecran. Avec une pente de 32 pour une demi-profondeur
     de 102 (soit 27,5 de montee), faitage et egout arriere tombaient a
     la meme hauteur et le toit paraissait plat. */
  const faite = 46, zf = td / 2;
  face(toit, [[tx, faite, zf], [tx + tw, faite, zf], [tx + tw, TOIT_H, td], [tx, TOIT_H, td]], VOL.toiture.cote);
  face(toit, [[tx + tw, TOIT_H, 0], [tx + tw, faite, zf], [tx + tw, TOIT_H, td]], VOL.toiture.dessus);
  face(toit, [[tx, faite, zf], [tx + tw, faite, zf], [tx + tw, TOIT_H, 0], [tx, TOIT_H, 0]], VOL.toiture.face);
  /* la souche, enfoncee sous le faitage pour qu'elle ne flotte pas */
  boite(toit, tx + tw * .58, faite - 54, zf - 16, 42, 78, 34,
        { face: C.souche, cote: '#9b6a4c', dessus: '#d6a183' });
  boite(toit, tx + tw * .56, faite - 68, zf - 20, 50, 14, 42,
        { face: '#56655f', cote: '#3f4b47', dessus: '#6d7d76' });

  /* --- buissons et arbustes au pied --- */
  const pied = g(planPres, { class: 'niveau', 'data-y': SOL_Y - 60, 'data-etage': NIVEAUX + 1 });
  const vPied = g(pied, { class: 'verdure' });
  /* Le pied du tronc est pose sur le PLAN du sol, a une profondeur
     tiree au sort, et le feuillage retombe exactement sur son sommet :
     avant, les deux etaient calcules separement et le tronc flottait a
     cote de la masse. */
  for (let i = 0; i < 8; i++) {
    const ax = rr(-VW * .06, VW * 1.06);
    if (ax > x0 - 50 && ax < x0 + EMPRISE + PROF * DX + 50) continue;
    const z = rr(-360, 300);
    const base = py(SOL_Y, z), cx = px(ax, z);
    const ah = rr(68, 118), tronc = ah * .46;
    el(vPied, 'rect', { x: (cx - 7).toFixed(1), y: (base - tronc).toFixed(1),
                        width: 14, height: tronc.toFixed(1), rx: 2, fill: C.brun,
                        stroke: C.trait, 'stroke-width': 2.4 });
    feuillage(vPied, cx, base - ah * .74, ah * 1.3, ah * .72, 1.1);
  }
  /* des buissons bas, serres contre le socle */
  for (let i = 0; i < 6; i++) {
    const z = rr(-300, -60);
    const ax = x0 + rr(-90, EMPRISE + 110);
    feuillage(vPied, px(ax, z), py(SOL_Y - 14, z), rr(76, 128), rr(32, 48), .95);
  }

  const vue = () => +svg.viewBox.baseVal.height;
  document.getElementById('defilement').style.height =
    Math.max(300, Math.min(900, (MONDE_H / vue()) * 100)) + 'vh';

  return { svg, planCiel, planPres, viteCiel: .34 };
}

/* ==================================================================
 * 8. LE DEFILEMENT — strictement vertical
 * ================================================================== */
const reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;
let vue = construire();
let camY = null, cible = 0;

const barre = document.querySelector('#progression i');
const compteur = document.getElementById('compteur');
const indice = document.getElementById('indice');
let niveauxDom = [...document.querySelectorAll('.niveau')];

function lireDefilement() {
  const max = document.documentElement.scrollHeight - innerHeight;
  const t = max > 0 ? Math.min(Math.max(scrollY / max, 0), 1) : 0;
  cible = t * Math.max(0, MONDE_H - +vue.svg.viewBox.baseVal.height);
}

function nomme(y, hVue) {
  const centre = y + hVue / 2;
  if (centre < CIEL_H - 40) return 'Ciel';
  if (y + hVue * .80 > SOL_Y) return 'Rue';
  const i = Math.floor((centre - CIEL_H - TOIT_H) / H);
  if (i < 0) return 'Toiture';
  if (i >= NIVEAUX) return 'Rez-de-chaussée';
  return `Étage <b>${NIVEAUX - i}</b>`;
}

function image() {
  if (camY === null) camY = cible;
  else camY += (cible - camY) * (reduit ? 1 : .12);

  vue.planPres.setAttribute('transform', `translate(0, ${(-camY).toFixed(2)})`);
  vue.planCiel.setAttribute('transform', `translate(0, ${(-camY * vue.viteCiel).toFixed(2)})`);

  const hVue = +vue.svg.viewBox.baseVal.height;
  for (const n of niveauxDom) n.classList.toggle('vu', +n.dataset.y < camY + hVue * .94);

  barre.style.transform = `scaleX(${(camY / Math.max(1, MONDE_H - hVue)).toFixed(4)})`;
  compteur.innerHTML = nomme(camY, hVue);
  indice.style.opacity = camY > hVue * .3 ? 0 : 1;
  requestAnimationFrame(image);
}

let minuteur, largeurCourante = innerWidth, hauteurCourante = innerHeight;
addEventListener('resize', () => {
  clearTimeout(minuteur);
  minuteur = setTimeout(() => {
    if (Math.abs(innerWidth - largeurCourante) > 2 || Math.abs(innerHeight - hauteurCourante) > 2) {
      largeurCourante = innerWidth; hauteurCourante = innerHeight;
      vue = construire();
      niveauxDom = [...document.querySelectorAll('.niveau')];
      marquerCliquables();
    }
    lireDefilement();
  }, 170);
});
addEventListener('scroll', lireDefilement, { passive: true });

/* ==================================================================
 * 9. LES BOUTONS A VENIR
 *    Chaque baie de la face avant est un <g> nomme, avec son etage et
 *    son rang. Tant qu'aucun texte n'est rattache, .cliquable est pose
 *    sur toutes pour qu'on voie les zones ; le jour ou les contenus
 *    arrivent, il suffira de ne le poser que sur celles qui en ont un.
 *
 *      immeuble.fenetres.forEach(f => f.addEventListener('click', () => {
 *        ouvrir(f.dataset.etage, f.dataset.travee);
 *      }));
 * ================================================================== */
function marquerCliquables() {
  for (const f of document.querySelectorAll('.fenetre')) f.classList.add('cliquable');
}
marquerCliquables();

window.immeuble = {
  marquerCliquables,
  get fenetres() { return [...document.querySelectorAll('.fenetre')]; },
  get camY() { return camY; },
  MONDE_H, NIVEAUX, H,
};

const style = document.createElement('style');
style.textContent = `
  @keyframes vole {
    0%   { transform: translate(${(-G.VW * .42).toFixed(0)}px, 44px); }
    50%  { transform: translate(${(G.VW * .22).toFixed(0)}px, -26px); }
    100% { transform: translate(${(G.VW * .9).toFixed(0)}px, 32px); }
  }
  @keyframes derive {
    0%   { transform: translate(-38px, 0); }
    100% { transform: translate(38px, 0); }
  }`;
document.head.appendChild(style);

lireDefilement();
image();
</script>
</body>
